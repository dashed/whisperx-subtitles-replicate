[project]
name = "whisperx-subtitles-replicate"
version = "0.1.0"
description = "WhisperX-based subtitle generation, deployed on Replicate via Cog."
readme = "README.md"
requires-python = "==3.11.*"
dependencies = [
    "torch~=2.8.0",
    "torchvision~=0.23.0",
    "torchaudio~=2.8.0",
    "ffmpeg-python",
    "pyannote.audio",
    "whisperx",
    # Transitive via whisperx, but floored explicitly: <1.2.0 drops word
    # timestamps for digits/symbols (whisperx >=3.8.4 requires it).
    "faster-whisper>=1.2.0",
    "pysbd==0.3.4",
    # Neural multilingual sentence segmentation (Thai/CJK); MIT-licensed.
    "wtpsplit~=2.2",
    # MMS forced-alignment fallback for languages outside whisperx's align set.
    # NOTE: pulls MMS weights at runtime which are CC-BY-NC 4.0 (non-commercial).
    "ctc-forced-aligner",
    # SentencePiece tokenizer for the MADLAD-400 translation model (T5-based).
    "sentencepiece",
]

[dependency-groups]
dev = [
    "ruff>=0.15",
    "ty>=0.0.49",
    "pytest>=8",
]

[tool.uv]
# This project only ever runs on Replicate's Linux/x86_64 CUDA GPU images
# (see cog.yaml). The torch *+cu128 wheels have no macOS build, so resolve and
# lock for that single deploy target only.
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }
# Pinned to a specific commit (not a floating HEAD) so re-locks are reproducible.
whisperx = { git = "https://github.com/m-bain/whisperx.git", rev = "5f2f9d4320dd93a7d12f5ba2495eef7e0a5af963" }
# git-only (the PyPI `ctc-forced-aligner` is an unrelated package); pinned by commit.
ctc-forced-aligner = { git = "https://github.com/MahmoudAshraf97/ctc-forced-aligner.git", rev = "264e7a1f81bff9ff5e787a5537020c2ad0b0df02" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# A sensible default set: pyflakes (F), pycodestyle (E/W), isort (I),
# pyupgrade (UP), flake8-bugbear (B), comprehensions (C4).
select = ["E", "W", "F", "I", "UP", "B", "C4"]
# The formatter owns line length and won't split long strings (e.g. the long
# cog Input descriptions), so don't double-report those as lint errors.
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# Cog's API uses `Input(...)` as parameter defaults by design (like FastAPI),
# so don't flag it under B008 (function-call-in-default-argument).
extend-immutable-calls = ["cog.Input"]

[tool.ty.environment]
python-version = "3.11"

[tool.ty.rules]
# The runtime stack (torch, whisperx, cog, pysbd, ffmpeg-python) is Linux/CUDA
# only and ships no type stubs, so it can't be resolved on a dev machine. Don't
# fail type checking on those imports; ty still checks all first-party code.
unresolved-import = "ignore"

[tool.ty.src]
# Tests pass dict literals where TypedDicts are expected (idiomatic for tests);
# don't type-check them — they're validated by running, not by ty.
exclude = ["tests/**"]

[tool.pytest.ini_options]
# Put the repo root on sys.path so `import whisperx_subtitles` works without
# installing the (Linux/CUDA-only) project. The pure modules under test
# (subtitles, audio) import only stdlib + pysbd + ffmpeg-python, so the suite
# runs anywhere — e.g. `uvx --with pysbd --with ffmpeg-python pytest`.
pythonpath = ["."]
testpaths = ["tests"]
